name: Check
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "5 6 * * 1"
  workflow_dispatch:
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true
jobs:
  pdf:
    name: pdf (latexmk main)
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install TeX Live
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          package_file: '${{ github.workspace }}/Texlivefile'
          texlive_version: 2026
      - name: Prepare latexmk
        run: |
          updmap -sys
          texhash
          tlmgr generate language --rebuild-sys
      - run: latexmk main

      # Highlight misspelled words in the PDF
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: aspell aspell-en aspell-de
          version: 1.0
          execute_install_scripts: true
      - name: post-setup aspell
        # refs https://github.com/awalsh128/cache-apt-pkgs-action/issues/157
        run: |
          sudo apt-get install -y aspell-en aspell-de
      - name: aspell
        run: |
          for tex in *.tex chapters-*/*.tex content-markdown*.md chapters-*/*.md; do
            [ -e "$tex" ] || continue
            if [[ "en" == "de" && ( "$tex" == thesis-example* || "$tex" == chapters-de/* ) ]]; then
              continue
            fi

            # The lualatex package "spelling" requires the content to be in a file ending with ".spell.bad"
            # Markdown files may contain LaTeX commands and references (<#id>, {#id}), which are no words.
            if [[ "$tex" == *.md ]]; then
              sed -E 's/\\[A-Za-z]+//g; s/<#[^>]*>//g; s/\{#[^}]*\}//g' "$tex" | aspell --mode=markdown\
                -l en_US\
                --encoding=utf-8\
                --conf=./.aspell.conf\
                -p ./.aspell.en.pws list\
                | sort | uniq >> main.spell.bad
            else
              aspell --mode=tex\
                -l en_US\
                --encoding=utf-8\
                --conf=./.aspell.conf\
                -p ./.aspell.en.pws list\
                < "$tex" | sort | uniq >> main.spell.bad
            fi
          done
      - run: latexmk main

      - name: Job summary using texlogsieve
        run: |
          texlogsieve --version | head -n 1

          echo '```' >> $GITHUB_STEP_SUMMARY
          texlogsieve main.log | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Install pdftoppm and ImageMagick
        # A TeX Live update can change the output (line breaks, fonts, spacing) without an error.
        # On the weekly run, the PDF published from main is the baseline; pages that differ are
        # rendered side by side in the artifact "pdf-diff". A difference is a warning, not a failure.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: poppler-utils imagemagick
          version: 1.0
          execute_install_scripts: true # creates the "compare" alternative
      - name: Compare with the published PDF
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if ! curl -sSfL -o published.pdf https://latextemplates.github.io/markdown-latex-quickstart/main.pdf; then
            echo "No published main.pdf to compare with." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pages() { pdfinfo "$1" | awk '/^Pages:/ { print $2 }'; }
          published=$(pages published.pdf)
          built=$(pages main.pdf)
          mkdir pdf-diff
          changed=0
          for i in $(seq 1 $(( published > built ? published : built ))); do
            if [ "$i" -gt "$published" ] || [ "$i" -gt "$built" ]; then
              changed=$((changed + 1))
              continue
            fi
            pdftoppm -r 50 -f "$i" -l "$i" -png -singlefile published.pdf "pdf-diff/page-$i-published"
            pdftoppm -r 50 -f "$i" -l "$i" -png -singlefile main.pdf "pdf-diff/page-$i-built"
            # "compare" exits with 1 when the pages differ and writes the differences in red
            if compare -metric AE "pdf-diff/page-$i-published.png" "pdf-diff/page-$i-built.png" "pdf-diff/page-$i-diff.png" 2>/dev/null; then
              rm "pdf-diff/page-$i-published.png" "pdf-diff/page-$i-built.png" "pdf-diff/page-$i-diff.png"
            else
              changed=$((changed + 1))
            fi
          done
          if [ "$changed" -eq 0 ]; then
            echo "main.pdf is identical to the published one ($built pages)." >> "$GITHUB_STEP_SUMMARY"
            rmdir pdf-diff
          else
            echo "::warning::main.pdf differs from the published one on $changed page(s); see the artifact pdf-diff"
            echo "main.pdf **differs** from the published one on $changed page(s) (published: $published pages, built: $built pages); the artifact \`pdf-diff\` shows the pages and their differences in red." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && hashFiles('pdf-diff/*.png') != ''
        with:
          name: pdf-diff
          path: pdf-diff/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-result
          path: |
            main.pdf
            main.log
            main.fls
  chktex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install TeX Live
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          package_file: '${{ github.workspace }}/Texlivefile'
          texlive_version: 2026
      - name: Check the LaTeX sources with ChkTeX (configuration in .chktexrc)
        run: |
          find . -maxdepth 2 \( -name 'main*.tex' -o -path './chapters-*/*.tex' \) -exec chktex -q {} + | tee chktex.txt
          if [ -s chktex.txt ]; then
            { echo "## ChkTeX"; echo; echo '```'; cat chktex.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
  word-count:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install TeX Live
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          package_file: '${{ github.workspace }}/Texlivefile'
          texlive_version: 2026
      - name: Count words
        run: |
          texcount -utf8 -inc main.tex > texcount.txt
          echo "## TeXcount word count" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat "texcount.txt" >> $GITHUB_STEP_SUMMARY

          texcount -utf8 -inc -v -html main.tex > texcount.html

          # output for summary
          # too verbose - therefore disabled
          #
          # texcount -utf8 -inc -v -htmlcore main.tex > texcount.html-body
          # echo "" >> $GITHUB_STEP_SUMMARY
          # echo "## TeXcount LaTeX interpretation" >> $GITHUB_STEP_SUMMARY
          # echo "" >> $GITHUB_STEP_SUMMARY
          # cat "texcount.html-body" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: word-count
          path: |
            texcount.txt
            texcount.html
  indent:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libyaml-tiny-perl libfile-homedir-perl
          version: 1.0
          execute_install_scripts: true
      - name: Install latexindent
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          packages: latexindent
          texlive_version: 2026
      - run: make format LOCAL=1
      - name: No changes made by latexindent
        run: git diff --exit-code
